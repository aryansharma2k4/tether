# tether -- make sshd wait for the tailnet address to exist
#
# Installed to: /etc/systemd/system/sshd.service.d/10-tether-tailnet.conf
#
# ===========================================================================
# THE FAILURE MODE THIS PREVENTS
# ===========================================================================
# laptop/sshd/10-tether.conf pins sshd to the Tailscale addresses. A process
# cannot bind an address that is not assigned to any interface: the bind()
# returns EADDRNOTAVAIL and sshd exits immediately with
#
#     error: Bind to port 22 on 100.x.y.z failed: Cannot assign requested
#     address.
#     fatal: Cannot bind any address.
#
# At boot, sshd and tailscaled race. The stock sshd.service orders itself
# only `After=network.target`, which is satisfied long before tailscaled has
# started, contacted the coordination server, and configured tailscale0.
# tailscaled needs a working network and a round trip to the control plane --
# on a cold boot on flaky hotel wifi that can be many seconds. sshd loses
# this race essentially every time.
#
# The stock unit has `Restart=always`, so at a glance it looks self-healing.
# It is not, and this is the trap:
#
#   * sshd's bind failure is instant -- a few milliseconds, not a timeout.
#   * The stock unit does not set RestartSec, so the default 100ms applies.
#   * systemd's default rate limit is StartLimitBurst=5 within
#     StartLimitIntervalSec=10s.
#
# Five failures at ~100ms apart is under one second. sshd exhausts its restart
# budget in well under a second, systemd marks the unit `failed`, and
# **stops trying forever**. Tailscale then comes up ten seconds later, the
# address appears, everything looks healthy -- `tailscale status` is green,
# the laptop pings on the tailnet -- and there is no sshd. You discover this
# from the phone, on the road, and the fix requires the physical keyboard.
#
# That is the whole reason this file exists. Three changes:
#
#   1. Order after tailscaled, so on a normal boot the race does not happen.
#   2. Wait for the address to actually appear, because "tailscaled started"
#      is not the same event as "tailscale0 has an address". Type=notify on
#      tailscaled means it is considered started once the daemon is ready,
#      which is BEFORE the tailnet is up if it still has to authenticate.
#   3. Remove the restart rate limit and slow the retries down, so that if
#      the wait times out anyway (no network at boot, tailnet reachable only
#      after a VPN prompt, a control-plane outage), sshd keeps retrying every
#      10 seconds indefinitely instead of giving up permanently.
#
# (3) is the one that actually saves you. (1) and (2) just make the normal
# case quiet.
# ===========================================================================

[Unit]
# Order after the tailnet agent. `Wants=` rather than `Requires=` on purpose:
# if tailscaled is broken we still want sshd to keep trying rather than be
# cancelled outright -- the retry loop below is the recovery path.
Wants=tailscaled.service
After=tailscaled.service

# `After=network.target` (stock) only means "networking has been set up",
# not "an interface is configured". network-online.target is the closer
# approximation of what tailscaled itself needs.
Wants=network-online.target
After=network-online.target

# Never stop retrying. This is the single most important line in the file:
# it is what turns "sshd is dead until I open the lid" into "sshd joins the
# tailnet whenever the tailnet shows up".
StartLimitIntervalSec=0

[Service]
# Wait for the tailnet address to be present on the interface before sshd
# even attempts its bind. Polls once a second for 90s.
#
# Both conditions are checked, because they are different facts:
#   `tailscale ip -4` succeeding means tailscaled knows our address;
#   the `ip addr` grep means the kernel has actually assigned it, which is
#   the thing bind(2) cares about.
#
# $$ is an escaped literal $ -- systemd would otherwise expand it.
ExecStartPre=/usr/bin/bash -c 'for i in $$(seq 1 90); do a=$$(/usr/bin/tailscale ip -4 2>/dev/null); if [ -n "$$a" ] && /usr/bin/ip -o -4 addr show dev tailscale0 2>/dev/null | grep -qF "$$a"; then exit 0; fi; sleep 1; done; echo "tether: tailnet address did not appear on tailscale0 within 90s" >&2; exit 1'

# Back off to 10s between attempts. With StartLimitIntervalSec=0 above this
# retries forever at a sane rate rather than burning through the default
# burst budget in under a second.
Restart=always
RestartSec=10s
