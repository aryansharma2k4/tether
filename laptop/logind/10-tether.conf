# tether -- stay reachable on AC, behave like a laptop on battery
#
# Installed to: /etc/systemd/logind.conf.d/10-tether.conf
#
# ---------------------------------------------------------------------------
# What this achieves, and what it cannot
# ---------------------------------------------------------------------------
# The requirement is a split: on AC the lid can close and the machine stays
# up and reachable; on battery it suspends normally, because a laptop that
# never sleeps in a bag is a dead battery and a hot chassis.
#
# The LID half of that split IS expressible in logind alone -- logind has
# separate keys for the two power states, which is exactly the distinction
# needed. That is the whole mechanism below.
#
# The IDLE half is NOT. IdleAction has no external-power counterpart; there
# is no `IdleActionExternalPower=`. logind can only apply one idle policy
# regardless of power source. See the note on IdleAction below for why that
# turns out not to matter here, and what to do if it ever does.
# ---------------------------------------------------------------------------

[Login]

# --- Lid, on AC -----------------------------------------------------------
# The one line that makes remote access work. Lid closed on mains power is
# treated as "I am putting this down, not putting it away": no suspend, the
# tailnet stays up, the zellij session stays live, sshd keeps answering.
HandleLidSwitchExternalPower=ignore

# --- Lid, on battery ------------------------------------------------------
# Unchanged laptop behaviour, stated explicitly rather than left to the
# default so that a future systemd default change cannot silently turn this
# machine into one that cooks itself in a backpack.
#
# The consequence is worth being clear about: unplugged and lid closed, the
# machine suspends and the tether session is unreachable until it wakes. That
# is intended. Wake-on-tailnet does not exist -- a suspended laptop has no
# network stack running. If you need reachability while away from a socket,
# the answer is to leave the lid open, not to change this line.
HandleLidSwitch=suspend

# Docked (external monitor attached) also stays awake. Same reasoning as AC:
# a docked machine is a stationary machine.
HandleLidSwitchDocked=ignore

# --- Idle -----------------------------------------------------------------
# Explicitly disable logind's idle timer. This is already the systemd
# default, so this line changes nothing today -- it is here to pin the
# behaviour, because an idle-suspend that only triggers after 30 minutes is
# precisely the kind of thing you discover by losing a session mid-command.
#
# There is no AC/battery split available for this key. Setting it to `ignore`
# is the conservative choice in both directions: it never suspends the box
# out from under a remote session, and it does not make battery behaviour
# more aggressive than it already is. It is NOT a backdoor "never sleep on
# battery" -- the lid rule above still suspends on battery, which is the
# case that actually matters for a machine in a bag.
#
# If you later want idle-suspend on battery only, logind cannot do it and you
# need a second component. On this machine that would be hypridle (not
# currently installed) with a listener whose action checks the power source
# first, e.g. a wrapper that reads /sys/class/power_supply/ACAD/online and
# only calls `systemctl suspend` when it reads 0. Do not try to fake it here.
IdleAction=ignore
IdleActionSec=0

# --- Notes on things this file does NOT control ---------------------------
#
# 1. Inhibitors win. Any process holding a `handle-lid-switch` inhibitor lock
#    overrides these keys entirely. Checked on this machine: the only locks
#    present are delay-mode `sleep` locks from NetworkManager, rtkit and
#    UPower, none of which touch lid handling -- so logind is authoritative
#    here. Under a full desktop environment that is often not true. Verify
#    with `systemd-inhibit --list`.
#
# 2. Explicit suspends still suspend. Nothing here stops a Hyprland keybind,
#    a power menu, or `systemctl suspend` from putting the machine to sleep
#    while you are connected from the phone. This file governs automatic
#    policy only.
#
# 3. Thermals. Lid-closed-on-AC means the machine can be running at full tilt
#    inside a closed shell. Fine on a desk. Do not do it in a padded bag.
#
# 4. logind has no ExecReload. Applying this needs a
#    `systemctl restart systemd-logind`, which is a heavier operation than a
#    reload and can disturb a running graphical session -- so install.sh
#    deliberately does not do it. See install.sh and docs/runbook.md.
