# tether -- sshd hardening + tailnet-only bind
#
# Installed to: /etc/ssh/sshd_config.d/10-tether.conf
# Rendered by:  laptop/install.sh (substitutes the __TAILSCALE_*__ placeholders)
#
# ---------------------------------------------------------------------------
# Why this file is named "10-"
# ---------------------------------------------------------------------------
# OpenSSH is NOT last-wins. For almost every keyword the FIRST value obtained
# wins and every later occurrence is silently ignored. Two consequences:
#
#   1. /etc/ssh/sshd_config on Arch has `Include /etc/ssh/sshd_config.d/*.conf`
#      on line 2, before any directive. So drop-ins are parsed first and a
#      drop-in CAN override the main file. On a distro that puts the Include
#      at the bottom, this file would be silently ineffective -- the main file
#      would have already claimed those keywords.
#
#   2. The Include glob is expanded in lexical order, so 10-tether.conf is
#      parsed before Arch's 99-archlinux.conf. Anything we set here beats
#      anything that file sets. A drop-in sorting before ours (00-*, 05-*)
#      would beat us in turn.
#
# install.sh does not trust either of those assumptions: it runs `sshd -T` and
# asserts the EFFECTIVE values, which is the only reliable check.
#
# ListenAddress is the exception to first-wins: it is CUMULATIVE. Every
# ListenAddress anywhere in the effective config adds another listening
# socket. We cannot subtract one from here, so if some other file adds a
# wildcard bind, this file cannot take it away. install.sh asserts the
# effective listenaddress set is exactly ours and refuses otherwise.
# ---------------------------------------------------------------------------

# --- Authentication -------------------------------------------------------
# Keys only. Password auth is the entire reason sshd on a laptop is scary.
PasswordAuthentication no
PermitEmptyPasswords no

# KbdInteractive is a separate door into the same room: with UsePAM yes it can
# still reach pam_unix and prompt for a password. Arch's 99-archlinux.conf
# already sets this to no; we set it too so this file is self-sufficient and
# does not depend on a file that sorts after it.
KbdInteractiveAuthentication no

# Belt and braces -- these are the mechanisms a misconfigured PAM stack or a
# future OpenSSH default could re-open.
ChallengeResponseAuthentication no
GSSAPIAuthentication no
HostbasedAuthentication no

PubkeyAuthentication yes
AuthenticationMethods publickey

# No root over the network, ever. Not even with a key -- if root access is
# needed it goes through a normal login and sudo, so it lands in the audit log
# attributable to a human.
PermitRootLogin no

# Only this account may log in. An unrelated service account that happens to
# grow an authorized_keys file does not become a remote entry point.
AllowUsers aryan

# --- Bind ------------------------------------------------------------------
# The point of the whole exercise: sshd listens ONLY on the Tailscale
# interface's addresses. On coffee-shop wifi, on campus wifi, on a hotel LAN,
# port 22 is not merely filtered -- there is no socket bound to that
# interface at all. A port scan of this host from the local subnet finds
# nothing to talk to.
#
# These are substituted by install.sh from `tailscale ip -4` / `-6`.
# Both are stable for the life of the node's tailnet identity.
ListenAddress __TAILSCALE_IPV4__
ListenAddress __TAILSCALE_IPV6__

# NOTE: binding here creates a startup-order dependency -- sshd cannot bind an
# address that does not exist yet, and tailscale0 does not exist until
# tailscaled has come up and authenticated. See
# laptop/systemd/sshd.service.d/10-tether-tailnet.conf, which is the other
# half of this change and is not optional.

# --- Session hygiene -------------------------------------------------------
# Keep-alives matter more than usual here. A mosh session's ssh connection is
# only used for the handshake and then exits, but a plain ssh fallback session
# on a phone that walks out of wifi range needs the server side to reap the
# dead connection rather than accumulate ghosts.
ClientAliveInterval 60
ClientAliveCountMax 3
TCPKeepAlive yes

# The tailnet is authenticated transport; we still do not need to forward
# anything. Turn off what is not used, so it cannot be abused if a key leaks.
AllowAgentForwarding no
AllowTcpForwarding no
X11Forwarding no
PermitTunnel no

# Rate-limit unauthenticated connections. Low value on a tailnet-only socket,
# but free.
MaxAuthTries 3
MaxSessions 10
LoginGraceTime 30
